spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

app:
  seguranca:
    jwt-segredo: ${JWT_SEGREDO}
    jwt-expiracao: 12h
    cookie-nome: sessao
    cookie-secure: true
  admin:
    nome: Paulo Roberto
    email: ${ADMIN_EMAIL}
    senha: ${ADMIN_PASSWORD}
  cors:
    origens:
      - ${FRONTEND_ORIGIN}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    rate-limit-por-minuto: 20
