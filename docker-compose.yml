services:
  postgres:
    image: postgres:17-alpine
    container_name: paulo-personal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paulo_personal}
      POSTGRES_USER: ${POSTGRES_USER:-paulo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paulo}
    ports:
      - "5433:5432"
    volumes:
      - paulo_personal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paulo} -d ${POSTGRES_DB:-paulo_personal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paulo_personal_pg:
